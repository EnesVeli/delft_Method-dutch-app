<!-- @dsCard group="Lesson" height=260 subtitle="Word-order tiles and tappable story words" -->
<!doctype html>
<html lang="nl">
<head><meta charset="utf-8"><title>WordTile preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&display=swap">
</head>
<body>
<div class="dd-col">
  <span class="dd-label">Zet in de goede volgorde</span>
  <div style="display:flex;flex-wrap:wrap;gap:var(--space-2)">
    <button class="dd-word">naar</button><button class="dd-word is-placed" tabindex="-1">Morgen</button><button class="dd-word">ik</button><button class="dd-word">ga</button><button class="dd-word is-saved">markt</button><button class="dd-word">de</button>
  </div>
  <span class="dd-label" style="margin-top:var(--space-3)">Het verhaal</span>
  <p style="margin:0;font-size:20px;line-height:32px">Anna <button class="dd-word-inline is-speaking">gaat</button> naar de <button class="dd-word-inline is-active">markt</button>. Ze koopt <button class="dd-word-inline">appels</button>.</p>
  <span class="dd-gloss" role="dialog" aria-label="markt"><b>de markt</b><span>the market · Add to review</span></span>
</div>
</body>
</html>
