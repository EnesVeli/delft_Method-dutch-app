<!doctype html>
<html lang="nl">
<head><meta charset="utf-8"><title>LessonBar preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&display=swap">
</head>
<body>
<div style="max-width:520px">
  <div class="dd-lessonbar">
    <button class="lb-close" aria-label="Stop les"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg></button>
    <div class="lb-steps" role="progressbar" aria-valuemin="0" aria-valuemax="8" aria-valuenow="4" aria-label="Exercise 5 of 8">
      <span class="lb-step done"></span><span class="lb-step done"></span><span class="lb-step missed"></span><span class="lb-step done"></span><span class="lb-step now"></span><span class="lb-step"></span><span class="lb-step"></span><span class="lb-step"></span>
    </div>
    <span class="dd-xp">+36</span>
  </div>
</div>
</body>
</html>
