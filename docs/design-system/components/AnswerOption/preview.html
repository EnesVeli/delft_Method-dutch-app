<!doctype html>
<html lang="nl">
<head><meta charset="utf-8"><title>AnswerOption preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&display=swap">
</head>
<body>
<div class="dd-col" role="radiogroup" aria-label="Wat is een appel?">
  <button class="dd-option" role="radio" aria-checked="false"><span class="o-key">1</span>a pear</button>
  <button class="dd-option is-selected" role="radio" aria-checked="true"><span class="o-key">2</span>an apple</button>
  <button class="dd-option is-correct" role="radio" aria-checked="true"><span class="o-key">3</span>an apple<span class="o-mark"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>Goed</span></button>
  <button class="dd-option is-incorrect" role="radio" aria-checked="true"><span class="o-key">4</span>a banana<span class="o-mark"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>Fout</span></button>
</div>
</body>
</html>
